name: Folder Structure Workflow Part 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate-folder-structure:
    name: Validate folder structure
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required directories
        run: |
          $requiredDirectories = @(".github", ".github/workflows", "docs")
          foreach ($directory in $requiredDirectories) {
            if (-not (Test-Path $directory -PathType Container)) {
              Write-Error "Required directory is missing: $directory"
            }
          }

      - name: Verify required files
        run: |
          $requiredFiles = @(
            "README.md",
            "docs/create_database_script.sql",
            "docs/API Endpoint Table.md",
            "docs/RaceDay Entity Relationship Diagram (ERD).png"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              Write-Error "Required file is missing: $file"
            }
          }

      - name: Validate database script
        run: |
          $scriptPath = "docs/create_database_script.sql"
          $scriptContent = Get-Content $scriptPath -Raw
          $requiredTables = @(
            "dbo.[User]",
            "dbo.Event",
            "dbo.EventCategory",
            "dbo.EventEnrolment",
            "dbo.Result",
            "dbo.Route"
          )
          foreach ($table in $requiredTables) {
            if ($scriptContent -notmatch [regex]::Escape("CREATE TABLE $table")) {
              Write-Error "Required table definition is missing: $table"
            }
          }
