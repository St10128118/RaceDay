name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend\RaceDay.Api.Tests\RaceDay.Api.Tests.csproj
      - name: Build
        run: dotnet build backend\RaceDay.Api.Tests\RaceDay.Api.Tests.csproj --no-restore --configuration Release
      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Test
        run: dotnet test backend\RaceDay.Api.Tests\RaceDay.Api.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=RaceDay.Tests.trx" --results-directory TestResults --verbosity normal
      - name: Check EF migrations are current
        run: dotnet ef migrations has-pending-model-changes --project backend\RaceDay.Api\RaceDay.Api.csproj
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceDay-test-results
          path: TestResults\RaceDay.Tests.trx
          if-no-files-found: ignore
